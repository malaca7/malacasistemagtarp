<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacking Device | Malaca System GTARP</title>
    <meta name="description" content="Simulador de hacking e decodificação de sistema. Encontre a sequência alvo na malha de caracteres.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="/images/platform_icon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin-overlay.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="starfield-bg"></canvas>

    <a href="/cidades/cda/" class="home-back-btn" title="Voltar" id="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <script>
        const params = new URLSearchParams(window.location.search);
        const city = params.get('cidade') || params.get('server');
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
            const currentPath = window.location.pathname;
            if (currentPath.includes('/valley/')) backBtn.href = '/cidades/valley/';
            else if (currentPath.includes('/los-santos/')) backBtn.href = '/cidades/los-santos/';
            else if (currentPath.includes('/cda/')) backBtn.href = '/cidades/cda/';
            else if (city) backBtn.href = `/cidades/${encodeURIComponent(city)}/`;
            else backBtn.href = '/cidades/cda/';
        }
    </script>

    <div class="app-container">
        <main class="hud-container hacking-hud-container">
            <div class="green-telemetry-banner">
                <div class="telemetry-row">
                    <span><span data-i18n="telemetry_streak">ACERTOS:</span> <strong id="val-streak">0</strong></span>
                    <i class="fa-solid fa-user-secret telemetry-icon"></i>
                    <span><span data-i18n="telemetry_max_streak">RECORDE:</span> <strong id="val-max-streak">0</strong></span>
                </div>
                <div class="telemetry-row">
                    <span><span data-i18n="telemetry_time">TEMPO:</span> <strong id="timer-val">0.000</strong></span>
                    <i class="fa-solid fa-stopwatch telemetry-icon"></i>
                    <span><span data-i18n="telemetry_best_time">MELHOR TEMPO:</span> <strong id="val-best-time">0.000</strong></span>
                </div>
            </div>

            <div class="on-screen-settings-panel">
                <div class="setting-row-center">
                    <span class="setting-label"><i class="fa-solid fa-microchip"></i> <span>MODO DE CODIFICAÇÃO:</span></span>
                    <div class="char-set-selector">
                        <button class="charset-btn active" data-set="futhark"><i class="fa-solid fa-terminal"></i> ELDER FUTHARK (GTA RP)</button>
                        <button class="charset-btn" data-set="alphanumeric">Alfanumérico</button>
                        <button class="charset-btn" data-set="runes">Runas</button>
                        <button class="charset-btn" data-set="numeric">Numérico</button>
                        <button class="charset-btn" data-set="greek">Grego</button>
                        <button class="charset-btn" data-set="all">Misto</button>
                    </div>
                </div>

                <div class="setting-row-center inline-settings">
                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-hashtags"></i> <span>DÍGITOS:</span></span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="length-btn" data-length="3">3</button>
                            <button class="length-btn active" data-length="4">4</button>
                            <button class="length-btn" data-length="5">5</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-stopwatch"></i> <span>TEMPO:</span></span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="time-btn" data-time="10">10s</button>
                            <button class="time-btn" data-time="15">15s</button>
                            <button class="time-btn active" data-time="20">20s</button>
                            <button class="time-btn" data-time="30">30s</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Authentic Cyberdeck GTA RP Boosting Device -->
            <div class="hacking-cyberdeck-container">
                <!-- Tela Roxa CRT perfeitamente encaixada na imagem física -->
                <div class="cyberdeck-screen">
                    <div class="cyberdeck-header">
                        <div class="cyberdeck-header-top">
                            <div>
                                <span class="cyberdeck-path">/boosting/sys</span>
                                <span class="cyberdeck-mode">ELDER FUTHARK 1</span>
                            </div>
                        </div>
                        <div class="cyberdeck-conn">//CONNECTED_TO_PROXYDATABASE</div>
                        
                        <div class="cyberdeck-code-row">
                            <div class="cyberdeck-code-label">
                                <span>CODE:</span>
                                <span class="cyberdeck-target-code" id="target-code">LOADING...</span>
                            </div>
                            <div class="cyberdeck-timer-box" id="timer-val">00.00</div>
                        </div>
                    </div>

                    <!-- Matriz de Caracteres 8x10 -->
                    <div class="cyberdeck-matrix-grid" id="character-soup-grid">
                        <!-- Gerado dinamicamente via JS -->
                    </div>

                    <!-- Overlays de Status Autênticos -->
                    <div class="cyberdeck-status-overlay" id="fail-overlay">
                        <div class="cyberdeck-status-banner fail">
                            ACCESS DENIED - BREACH FAILED
                        </div>
                        <button class="cyberdeck-action-btn" id="btn-retry-puzzle">[ RETRY ]</button>
                    </div>

                    <div class="cyberdeck-status-overlay" id="success-overlay">
                        <div class="cyberdeck-status-banner success">
                            BREACH SUCCESSFUL - ACCESS GRANTED
                        </div>
                        <button class="cyberdeck-action-btn" id="btn-next-puzzle">[ NEXT ]</button>
                    </div>
                </div>

                <!-- D-Pad Hitbox Overlay sobre os botões metálicos físicos do dispositivo -->
                <div class="cyberdeck-dpad-hitbox dpad-hit-up" id="dpad-up" title="Cima (W ou ↑)" role="button" tabindex="0">
                    <i class="fa-solid fa-caret-up cyberdeck-dpad-icon"></i>
                </div>
                <div class="cyberdeck-dpad-hitbox dpad-hit-down" id="dpad-down" title="Baixo (S ou ↓)" role="button" tabindex="0">
                    <i class="fa-solid fa-caret-down cyberdeck-dpad-icon"></i>
                </div>
                <div class="cyberdeck-dpad-hitbox dpad-hit-left" id="dpad-left" title="Esquerda (A ou ←)" role="button" tabindex="0">
                    <i class="fa-solid fa-caret-left cyberdeck-dpad-icon"></i>
                </div>
                <div class="cyberdeck-dpad-hitbox dpad-hit-right" id="dpad-right" title="Direita (D ou →)" role="button" tabindex="0">
                    <i class="fa-solid fa-caret-right cyberdeck-dpad-icon"></i>
                </div>

                <!-- Placa metálica inferior direita como botão de confirmação física -->
                <div class="cyberdeck-plate-hitbox" id="btn-submit" title="Confirmar Seleção (Enter)" role="button" tabindex="0">
                    <span class="cyberdeck-plate-hint">BREACH [ENTER]</span>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/i18n.js"></script>
    <script type="module" src="/hacking.js"></script>
    <script type="module" src="/admin-overlay.js"></script>
</body>
</html>
