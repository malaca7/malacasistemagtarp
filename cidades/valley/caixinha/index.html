<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixinha Eletrônico (Valley) | Malaca System GTARP</title>
    <meta name="description" content="Simulador de Caixinha Eletrônico para Valley RP.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/platform_icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-Dezn_h7o.js"></script>
  <script type="module" crossorigin src="/assets/i18n-A6kVPnnh.js"></script>
  <script type="module" crossorigin src="/assets/caixinha-9DWFLa9L.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/styles-CJ97Wg_3.css">
</head>
<body>
    <canvas id="starfield-bg"></canvas>
    <a href="/cidades/valley/" class="home-back-btn" title="Voltar para Valley" id="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="app-container">
        <main class="hud-container caixinha-eletronico-container">
            <div class="on-screen-settings-panel">
                <div class="setting-row-center inline-settings">
                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-layer-group"></i> NÍVEL DE DIGITAÇÃO:</span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="diff-btn active" data-difficulty="novice">FÁCIL</button>
                            <button class="diff-btn" data-difficulty="advanced">MÉDIO</button>
                            <button class="diff-btn" data-difficulty="expert">HARD</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="top-status-banner" id="caixinha-banner">
                <div class="status-box success-box hidden" id="status-success">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>CAIXA ELETRÔNICO ARROMBADO COM SUCESSO!</span>
                </div>
                <div class="status-box error-box hidden" id="status-error">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>SEQUÊNCIA INCORRETA! ALARME DISPARADO.</span>
                </div>
            </div>
            <div class="caixinha-device-wrapper flex-center flex-col">
                <div class="caixinha-display-box" id="caixinha-display">
                    <span class="caixinha-placeholder text-slate-500 font-mono">DIGITE A SEQUÊNCIA ALVO...</span>
                </div>
            </div>
            <div class="hud-bottom-panel">
                <div class="stat-card">
                    <span class="stat-label">TEMPO RESTANTE:</span>
                    <span class="stat-value highlight-orange" id="caixinha-timer">10.0s</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">PONTUAÇÃO:</span>
                    <span class="stat-value highlight-gold" id="caixinha-score">0</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
