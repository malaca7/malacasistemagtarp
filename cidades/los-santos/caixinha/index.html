<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixinha Eletrônico | Malaca System GTARP</title>
    <meta name="description" content="Simulador de Caixinha Eletrônico. Minijogo de digitação rápida de letras.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="/images/platform_icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/dist-C4Qc8-Kv.js"></script>
  <script type="module" crossorigin src="/assets/admin-overlay-CrqWmXde.js"></script>
  <script type="module" crossorigin src="/assets/i18n-A6kVPnnh.js"></script>
  <script type="module" crossorigin src="/assets/caixinha-BfTnyQQv.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/admin-overlay-BSQiEq5e.css">
  <link rel="stylesheet" crossorigin href="/assets/styles-B74CB627.css">
</head>
<body>
    <canvas id="starfield-bg"></canvas>

    <a href="/cidades/cda/" class="home-back-btn" title="Voltar" id="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <script>
        const params = new URLSearchParams(window.location.search);
        const city = params.get('cidade') || params.get('server');
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
            const currentPath = window.location.pathname;
            if (currentPath.includes('/valley/')) backBtn.href = '/cidades/valley/';
            else if (currentPath.includes('/los-santos/')) backBtn.href = '/cidades/los-santos/';
            else if (currentPath.includes('/cda/')) backBtn.href = '/cidades/cda/';
            else if (city) backBtn.href = `/cidades/${encodeURIComponent(city)}/`;
            else backBtn.href = '/cidades/cda/';
        }
    </script>

    <div class="app-container">
        <main class="hud-container caixinha-eletronico-container">
            <div class="on-screen-settings-panel">
                <div class="setting-row-center inline-settings">
                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-gauge-high"></i> TEMPO:</span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="diff-btn" data-difficulty="easy" id="btn-easy">FÁCIL (12s)</button>
                            <button class="diff-btn active" data-difficulty="medium" id="btn-medium">MÉDIO (9s)</button>
                            <button class="diff-btn" data-difficulty="hard" id="btn-hard">DIFÍCIL (6.5s)</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-gamepad"></i> MODO:</span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="diff-btn mode-btn active" data-mode="standard" id="btn-mode-standard">PADRÃO (3 SEQS)</button>
                            <button class="diff-btn mode-btn" data-mode="endless" id="btn-mode-endless">INFINITO</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="top-status-banner" id="status-banner">
                <div class="success-overlay" id="success-overlay">
                    <div class="banner-box success-box-top">
                        <div class="banner-text">
                            <i class="fa-solid fa-circle-check"></i>
                            <strong>SISTEMA HACKEADO:</strong> <span id="success-message">Acesso eletrônico concedido.</span>
                        </div>
                        <button class="btn btn-primary btn-sm" id="btn-next-puzzle">PRÓXIMA CAIXINHA</button>
                    </div>
                </div>
                
                <div class="success-overlay" id="fail-overlay">
                    <div class="banner-box fail-box-top">
                        <div class="banner-text">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <strong>FALHA NO SISTEMA:</strong> Sequência incorreta ou tempo esgotado.
                        </div>
                        <button class="btn btn-danger btn-sm" id="btn-retry-puzzle">TENTAR NOVAMENTE</button>
                    </div>
                </div>
            </div>

            <div class="caixinha-device-wrapper">
                <div class="caixinha-card-header">
                    <h2>CAIXINHA ELETRÔNICO</h2>
                    <div class="streaks-hud">
                        <span>TEMPO: <strong id="level-val" style="color: var(--color-cyan);">8.0s</strong></span>
                        <span>STATUS: <strong id="instruction-val" style="color: var(--color-success);">AGUARDANDO INÍCIO</strong></span>
                    </div>
                </div>
                
                <div class="typing-sequence-container">
                    <div class="caixinha-counter" id="caixinha-counter">0/8</div>
                    
                    <div class="caixinha-timer-bar">
                        <div class="timer-fill" id="timer-fill"></div>
                    </div>
                    
                    <div class="typing-sequence" id="typing-sequence">
                        <!-- Quadrados de letras gerados via JS -->
                    </div>

                    <div class="caixinha-controls-bar" style="margin-top: 15px; text-align: center;">
                        <button class="btn btn-primary btn-start-game" id="btn-start-caixinha" style="padding: 10px 24px; font-size: 14px; font-weight: 800; letter-spacing: 0.05em; border-radius: 10px; cursor: pointer;">
                            <i class="fa-solid fa-play"></i> INICIAR (ESPAÇO)
                        </button>
                    </div>

                    <!-- Teclado Virtual para Mouse e Celular -->
                    <div class="virtual-keypad" id="virtual-keypad" style="margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                        <span style="font-size: 11px; font-weight: 700; color: #7dd3fc; text-transform: uppercase; letter-spacing: 0.08em;">Teclado Interativo (Clique ou Teclado):</span>
                        <div style="display: flex; gap: 8px; justify-content: center;">
                            <button class="vkey-btn" data-key="Q">Q</button>
                            <button class="vkey-btn" data-key="W">W</button>
                            <button class="vkey-btn" data-key="E">E</button>
                            <button class="vkey-btn" data-key="A">A</button>
                            <button class="vkey-btn" data-key="S">S</button>
                            <button class="vkey-btn" data-key="D">D</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
