<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Hacking | Portal de Treinamento</title>
    <meta name="description" content="Simulador de hacking e decodificação de sistema. Encontre a sequência alvo na malha de caracteres.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Link para a folha de estilo -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="hacking-page-body">
    <!-- Canvas de Fundo Estrelado -->
    <canvas id="starfield-bg"></canvas>

    <!-- Botão de voltar para a Home -->
    <a href="index.html" class="home-back-btn" title="Voltar para a Home">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="app-container hacking-app-container">
        <!-- HUD Centralizado -->
        <main class="hud-container hacking-hud-container">
            
            <!-- Dispositivo de Hacking Principal -->
            <div class="hacking-device-wrapper">
                
                <!-- Cabeçalho do Hacking -->
                <div class="hacking-top-bar">
                    <h2 class="hacking-main-title">
                        <i class="fa-solid fa-terminal"></i> SIMULADOR DE HACKING
                    </h2>
                    <div class="streaks-hud">
                        <span>STREAK: <strong id="val-streak">0</strong></span>
                        <span>MAX: <strong id="val-max-streak">0</strong></span>
                    </div>
                </div>

                <!-- PAINEL CENTRAL DE CONFIGURAÇÕES NA TELA (NO MEIO) -->
                <div class="on-screen-settings-panel">
                    <!-- Linha 1: Tipo de Caracteres -->
                    <div class="setting-row-center">
                        <span class="setting-label"><i class="fa-solid fa-font"></i> TIPO:</span>
                        <div class="char-set-selector">
                            <button class="charset-btn active" data-set="numeric">Numérico</button>
                            <button class="charset-btn" data-set="alphabet">Alfabeto</button>
                            <button class="charset-btn" data-set="alphanumeric">Alfanumérico</button>
                            <button class="charset-btn" data-set="greek">Grego</button>
                            <button class="charset-btn" data-set="braille">Braille</button>
                            <button class="charset-btn" data-set="runes">Runas</button>
                            <button class="charset-btn" data-set="symbols">Símbolos</button>
                        </div>
                    </div>

                    <!-- Linha 2: Tamanho & Tempo -->
                    <div class="setting-row-center inline-settings">
                        <div class="setting-group">
                            <span class="setting-label"><i class="fa-solid fa-hashtags"></i> TAMANHO:</span>
                            <div class="drawer-difficulty-selector flex-row-buttons">
                                <button class="length-btn" data-length="3">3</button>
                                <button class="length-btn active" data-length="4">4</button>
                                <button class="length-btn" data-length="5">5</button>
                                <button class="length-btn" data-length="6">6</button>
                            </div>
                        </div>

                        <div class="setting-group">
                            <span class="setting-label"><i class="fa-solid fa-stopwatch"></i> TEMPO:</span>
                            <div class="drawer-difficulty-selector flex-row-buttons">
                                <button class="time-btn" data-time="5">5s</button>
                                <button class="time-btn" data-time="10">10s</button>
                                <button class="time-btn active" data-time="15">15s</button>
                                <button class="time-btn" data-time="20">20s</button>
                                <button class="time-btn" data-time="30">30s</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tela de Jogo de Caracteres -->
                <div class="hacking-main-container">
                    <div class="hacking-target-panel">
                        <div class="target-label">LOCALIZE A SEQUÊNCIA ALVO:</div>
                        <div class="target-code-display" id="target-code">LOADING...</div>
                    </div>

                    <!-- Malha de Caracteres (8x10 Grid = 80 Células) -->
                    <div class="character-soup-grid" id="character-soup-grid">
                        <!-- Gerado dinamicamente via JS -->
                    </div>
                </div>

                <!-- Overlay de Sucesso -->
                <div class="success-overlay" id="success-overlay">
                    <div class="success-box">
                        <div class="lock-icon-wrapper animate-pulse">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2>ACESSO CONCEDIDO</h2>
                        <p id="success-message">Sequência encontrada com sucesso!</p>
                        <div class="success-stats">
                            <div>Tempo: <strong id="succ-time">0.00s</strong></div>
                            <div>Streak Atual: <strong id="succ-streak">0</strong></div>
                        </div>
                        <button class="btn btn-primary" id="btn-next-puzzle">PRÓXIMO HACK (ENTER)</button>
                    </div>
                </div>

                <!-- Overlay de Falha -->
                <div class="success-overlay" id="fail-overlay">
                    <div class="success-box">
                        <div class="lock-icon-wrapper red-wrapper">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h2 class="red-title">ACESSO NEGADO</h2>
                        <p id="fail-message">Sequência incorreta ou tempo esgotado.</p>
                        <button class="btn red-btn" id="btn-retry-puzzle">TENTAR NOVAMENTE (ENTER)</button>
                    </div>
                </div>
            </div>

            <!-- Painel de Controle Inferior -->
            <div class="hud-bottom-panel">
                <div class="hud-panel-header">
                    <div class="hud-title">SIMULADOR DE HACKING</div>
                    <div class="hud-stats">
                        <div class="hud-stat-box timer-box" id="timer-val">15.0s</div>
                    </div>
                </div>

                <!-- Atalhos / Botões de Ação na Base -->
                <div class="hud-actions-footer">
                    <button class="hud-footer-btn red-footer-btn" id="btn-stop-game" title="Parar (Espaço)">
                        <i class="fa-solid fa-stop"></i> PARAR HACK (ESPAÇO)
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de Hacking -->
    <script type="module" src="/hacking.js"></script>
</body>
</html>
