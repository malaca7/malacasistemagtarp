<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixinha Eletrônico | Portal de Treinamento</title>
    <meta name="description" content="Simulador de Caixinha Eletrônico. Minijogo de digitação rápida de letras.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Link para a folha de estilo -->
    
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/malacasistemagtarp/assets/caixinha-CexwhEWb.js"></script>
  <link rel="modulepreload" crossorigin href="/malacasistemagtarp/assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="stylesheet" crossorigin href="/malacasistemagtarp/assets/styles-CzbZj29V.css">
</head>
<body>
    <!-- Canvas de Fundo Estrelado -->
    <canvas id="starfield-bg"></canvas>

    <!-- Botão de voltar para a Home -->
    <a href="index.html" class="home-back-btn" title="Voltar para a Home">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="app-container">
        <!-- HUD Centralizado (Mesmo Padrão de Organização do Lockpick) -->
        <main class="hud-container caixinha-eletronico-container">
            
            <!-- 1. BARRA DE CONFIGURAÇÕES NA TELA (NO MEIO) -->
            <div class="on-screen-settings-panel">
                <div class="setting-row-center inline-settings">
                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-gauge-high"></i> TEMPO:</span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="diff-btn" data-difficulty="easy" id="btn-easy">FÁCIL (10s)</button>
                            <button class="diff-btn active" data-difficulty="medium" id="btn-medium">MÉDIO (8s)</button>
                            <button class="diff-btn" data-difficulty="hard" id="btn-hard">DIFÍCIL (5s)</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-gamepad"></i> MODO:</span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="diff-btn mode-btn active" data-mode="standard" id="btn-mode-standard">PADRÃO (3 SEQS)</button>
                            <button class="diff-btn mode-btn" data-mode="endless" id="btn-mode-endless">INFINITO</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. DISPOSITIVO CENTRAL DA CAIXINHA -->
            <div class="caixinha-device-wrapper">
                <div class="caixinha-card-header">
                    <h2>CAIXINHA ELETRÔNICO</h2>
                </div>
                
                <div class="typing-sequence-container">
                    <div class="caixinha-counter" id="caixinha-counter">0/8</div>
                    
                    <div class="caixinha-timer-bar">
                        <div class="timer-fill" id="timer-fill"></div>
                    </div>
                    
                    <div class="typing-sequence" id="typing-sequence">
                        <!-- Quadrados de letras gerados via JS -->
                    </div>
                    
                    <!-- Overlay de Sucesso -->
                    <div class="success-overlay" id="success-overlay">
                        <div class="success-box">
                            <div class="lock-icon-wrapper animate-pulse" style="border-color: var(--color-success); color: var(--color-success);">
                                <i class="fa-solid fa-unlock-keyhole"></i>
                            </div>
                            <h2 style="color: var(--color-success);">SISTEMA HACKEADO</h2>
                            <p id="success-message">Acesso eletrônico concedido.</p>
                            <button class="btn btn-primary" id="btn-next-puzzle">PRÓXIMA CAIXINHA</button>
                        </div>
                    </div>

                    <!-- Overlay de Derrota -->
                    <div class="success-overlay" id="fail-overlay" style="background: rgba(255, 23, 68, 0.15); backdrop-filter: blur(8px);">
                        <div class="success-box">
                            <div class="lock-icon-wrapper" style="border-color: var(--color-error); color: var(--color-error);">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <h2 style="color: var(--color-error);">FALHA NO SISTEMA</h2>
                            <p>Sequência incorreta ou tempo esgotado.</p>
                            <button class="btn" style="border-color: var(--color-error); color: var(--color-error);" id="btn-retry-puzzle">TENTAR NOVAMENTE</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. PAINEL DE CONTROLE INFERIOR (MESMO PADRÃO DO LOCKPICK) -->
            <div class="hud-bottom-panel">
                <div class="hud-panel-header">
                    <div class="hud-title">PAINEL DE CONTROLE</div>
                    <div class="hud-stats">
                        <div class="hud-stat-box timer-box" id="level-val">TEMPO: 8s</div>
                    </div>
                </div>
                
                <div class="safe-status-container" style="border-bottom: none; padding-bottom: 0;">
                    <div class="safe-rotation-hint" id="game-instruction">
                        <span>STATUS:</span> <strong id="instruction-val" class="text-accent">AGUARDANDO INÍCIO</strong>
                    </div>
                </div>
                
                <div class="hud-actions-footer">
                    <button class="hud-footer-btn" id="btn-stop-game" title="Parar (Espaço)" style="color: #ff3333; border-color: rgba(255,51,51,0.3);">
                        <i class="fa-solid fa-stop"></i> ESPAÇO (PARAR)
                    </button>
                    <button class="hud-footer-btn slot-btn" id="btn-start" title="Iniciar Hacking (Enter)">
                        <i class="fa-solid fa-play"></i> INICIAR (ENTER)
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Principal -->
</body>
</html>
