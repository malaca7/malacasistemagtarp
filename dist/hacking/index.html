<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Hacking | Portal de Treinamento</title>
    <meta name="description" content="Simulador de hacking e decodificação de sistema. Encontre a sequência alvo na malha de caracteres.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Link para a folha de estilo -->
    
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-Dezn_h7o.js"></script>
  <script type="module" crossorigin src="/assets/i18n-A6kVPnnh.js"></script>
  <script type="module" crossorigin src="/assets/hacking-C-93Tf2I.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/styles-CJ97Wg_3.css">
</head>
<body>
    <!-- Canvas de Fundo Estrelado -->
    <canvas id="starfield-bg"></canvas>

    <!-- Botão de voltar para a Cidade/Home -->
    <a href="../" class="home-back-btn" title="Voltar" id="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <script>
        const params = new URLSearchParams(window.location.search);
        const city = params.get('cidade') || params.get('server');
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
            backBtn.href = city ? `/cidades/${encodeURIComponent(city)}/` : '/cidades/cda/';
        }
    </script>

    <div class="app-container">
        <!-- HUD Centralizado -->
        <main class="hud-container hacking-hud-container">
            
            <!-- BANNER SUPERIOR DE TELEMETRIA (ESTILO EXATO GTARP) -->
            <div class="green-telemetry-banner">
                <div class="telemetry-row">
                    <span><span data-i18n="telemetry_streak">ACERTOS:</span> <strong id="val-streak">0</strong></span>
                    <i class="fa-solid fa-user-secret telemetry-icon"></i>
                    <span><span data-i18n="telemetry_max_streak">RECORDE:</span> <strong id="val-max-streak">0</strong></span>
                </div>
                <div class="telemetry-row">
                    <span><span data-i18n="telemetry_time">TEMPO:</span> <strong id="timer-val">0.000</strong></span>
                    <i class="fa-solid fa-stopwatch telemetry-icon"></i>
                    <span><span data-i18n="telemetry_best_time">MELHOR TEMPO:</span> <strong id="val-best-time">0.000</strong></span>
                </div>
            </div>

            <!-- 1. BARRA DE CONFIGURAÇÕES NA TELA (NO MEIO) -->
            <div class="on-screen-settings-panel">
                <div class="setting-row-center">
                    <span class="setting-label"><i class="fa-solid fa-font"></i> <span data-i18n="type_label">TIPO:</span></span>
                    <div class="char-set-selector">
                        <button class="charset-btn active" data-set="all" data-i18n="charset_all">MISTO (TODOS)</button>
                        <button class="charset-btn" data-set="numeric" data-i18n="charset_numeric">Numérico</button>
                        <button class="charset-btn" data-set="alphabet" data-i18n="charset_alphabet">Alfabeto</button>
                        <button class="charset-btn" data-set="alphanumeric" data-i18n="charset_alphanumeric">Alfanumérico</button>
                        <button class="charset-btn" data-set="greek" data-i18n="charset_greek">Grego</button>
                        <button class="charset-btn" data-set="braille" data-i18n="charset_braille">Braille</button>
                        <button class="charset-btn" data-set="runes" data-i18n="charset_runes">Runas</button>
                        <button class="charset-btn" data-set="symbols" data-i18n="charset_symbols">Símbolos</button>
                    </div>
                </div>

                <div class="setting-row-center inline-settings">
                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-hashtags"></i> <span data-i18n="size_label">TAMANHO:</span></span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="length-btn" data-length="3">3</button>
                            <button class="length-btn active" data-length="4">4</button>
                            <button class="length-btn" data-length="5">5</button>
                            <button class="length-btn" data-length="6">6</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <span class="setting-label"><i class="fa-solid fa-stopwatch"></i> <span data-i18n="time_label">TEMPO:</span></span>
                        <div class="drawer-difficulty-selector flex-row-buttons">
                            <button class="time-btn" data-time="10">10s</button>
                            <button class="time-btn" data-time="15">15s</button>
                            <button class="time-btn active" data-time="20">20s</button>
                            <button class="time-btn" data-time="30">30s</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. BANNER DE MENSAGENS ACIMA DO SISTEMA -->
            <div class="top-status-banner" id="status-banner">
                <!-- Mensagem de Sucesso -->
                <div class="success-overlay" id="success-overlay">
                    <div class="banner-box success-box-top">
                        <div class="banner-text">
                            <i class="fa-solid fa-circle-check"></i>
                            <strong data-i18n="hacking_success_title">ACESSO CONCEDIDO:</strong> <span id="success-message" data-i18n="hacking_success_msg">Sequência encontrada com sucesso!</span>
                            <span class="banner-stats-inline">(Tempo: <strong id="succ-time">0.000s</strong> | Streak: <strong id="succ-streak">0</strong>)</span>
                        </div>
                        <button class="btn btn-primary btn-sm" id="btn-next-puzzle" data-i18n="btn_next_hack">PRÓXIMO HACK (ENTER)</button>
                    </div>
                </div>
                
                <!-- Mensagem de Falha -->
                <div class="success-overlay" id="fail-overlay">
                    <div class="banner-box fail-box-top">
                        <div class="banner-text">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <strong data-i18n="hacking_fail_title">ACESSO NEGADO:</strong> <span id="fail-message" data-i18n="hacking_fail_msg">Sequência incorreta ou tempo esgotado.</span>
                        </div>
                        <button class="btn btn-danger btn-sm" id="btn-retry-puzzle" data-i18n="btn_retry">TENTAR NOVAMENTE (ENTER)</button>
                    </div>
                </div>
            </div>

            <!-- 3. DISPOSITIVO CENTRAL DE HACKING (ESTILO GTARP IDENTICO AO PRINT) -->
            <div class="hacking-device-wrapper">
                <!-- Ícone de Espião (Spy Silhouette Icon) -->
                <div class="spy-icon-wrapper">
                    <i class="fa-solid fa-user-secret spy-icon"></i>
                </div>

                <!-- Título Status do Host -->
                <div class="host-connecting-title" data-i18n="connecting_host_text">
                    CONECTANDO AO SERVIDOR
                </div>

                <!-- Sequência Alvo -->
                <div class="hacking-target-panel">
                    <div class="target-code-display" id="target-code">LOADING...</div>
                </div>

                <!-- Malha de Caracteres (8x10 Grid = 80 Células) -->
                <div class="character-soup-grid" id="character-soup-grid">
                    <!-- Gerado dinamicamente via JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Script de Hacking -->
</body>
</html>
