<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockpick Simulator | Portal de Treinamento</title>
    <meta name="description" content="Simulador e treinador do minijogo de arrombamento Lockpick.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Link para a folha de estilo -->
    
    <!-- FontAwesome para ícones premium -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/malacasistemagtarp/assets/lockpick-Pn5GoqLQ.js"></script>
  <link rel="modulepreload" crossorigin href="/malacasistemagtarp/assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="stylesheet" crossorigin href="/malacasistemagtarp/assets/styles-JNGPcUVF.css">
</head>
<body>
    <!-- Canvas de Fundo para o efeito de estrelas -->
    <canvas id="starfield-bg"></canvas>

    <!-- Botão de voltar para a Home -->
    <a href="index.html" class="home-back-btn" title="Voltar para a Home">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="app-container">
        <!-- Status do Dispositivo -->
        <div class="device-status" style="display: none;">
            <span class="status-indicator active" id="lock-status-indicator"></span>
            <span id="lock-status-text">DISPOSITIVO ATIVO</span>
        </div>

        <!-- HUD Centralizado -->
        <main class="hud-container">
            
            <!-- SELETOR DE DIFICULDADE NO MEIO DA TELA -->
            <div class="on-screen-settings-panel lockpick-settings">
                <div class="setting-row-center">
                    <span class="setting-label"><i class="fa-solid fa-gauge-high"></i> DIFICULDADE:</span>
                    <div class="drawer-difficulty-selector flex-row-buttons">
                        <button class="diff-btn active" data-difficulty="novice" id="btn-novice">NOVATO</button>
                        <button class="diff-btn" data-difficulty="advanced" id="btn-advanced">AVANÇADO</button>
                        <button class="diff-btn" data-difficulty="expert" id="btn-expert">PERITO</button>
                        <button class="diff-btn" data-difficulty="master" id="btn-master">MESTRE</button>
                        <button class="diff-btn daily-btn" data-difficulty="daily" id="btn-daily">
                            <i class="fa-solid fa-calendar-day"></i> DIÁRIO
                        </button>
                    </div>
                </div>
            </div>

            <!-- 1. O Dispositivo Circular de Lockpick -->
            <div class="lockpick-device-wrapper">
                <div class="canvas-container">
                    <canvas id="digipick-canvas" width="600" height="600"></canvas>
                    <div class="lockpick-center-badge">LOCKPICK</div>
                    
                    <!-- Overlay de Sucesso -->
                    <div class="success-overlay" id="success-overlay">
                        <div class="success-box">
                            <div class="lock-icon-wrapper animate-pulse">
                                <i class="fa-solid fa-lock-open"></i>
                            </div>
                            <h2>DESBLOQUEADO</h2>
                            <p id="success-message">Acesso concedido.</p>
                            <div class="success-stats">
                                <div>Tempo: <strong id="succ-time">00:00</strong></div>
                                <div>Chaves: <strong id="succ-keys">0</strong></div>
                            </div>
                            <button class="btn btn-primary" id="btn-next-puzzle">NOVO PUZZLE</button>
                        </div>
                    </div>
                    
                    <!-- Overlay de Falha -->
                    <div class="success-overlay" id="fail-overlay" style="background: rgba(255, 23, 68, 0.15); backdrop-filter: blur(8px);">
                        <div class="success-box">
                            <div class="lock-icon-wrapper" style="border-color: var(--color-error); color: var(--color-error);">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <h2 style="color: var(--color-error);">FALHA NO LOCKPICK</h2>
                            <p id="fail-message">O tempo esgotou ou você cancelou.</p>
                            <button class="btn" style="border-color: var(--color-error); color: var(--color-error);" id="btn-retry-puzzle">TENTAR NOVAMENTE</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. O Painel de Controle Inferior -->
            <div class="hud-bottom-panel">
                <div class="hud-panel-header">
                    <div class="hud-title">LOCKPICK SIMULATOR</div>
                    <div class="hud-stats">
                        <div class="hud-stat-box timer-box" id="timer-val">00:00</div>
                        <div class="hud-stat-box picks-box" id="picks-val">99</div>
                    </div>
                </div>
                
                <!-- Grade de Chaves -->
                <div class="hud-keys-grid" id="keys-container">
                    <!-- Gerado dinamicamente via JS -->
                </div>
                
                <!-- Atalhos / Botões de Ação na Base -->
                <div class="hud-actions-footer">
                    <button class="hud-footer-btn" id="btn-stop-game" title="Parar (Espaço)" style="color: #ff3333; border-color: rgba(255,51,51,0.3);">
                        <i class="fa-solid fa-stop"></i> ESPAÇO
                    </button>
                    <button class="hud-footer-btn" id="btn-reset" title="Reiniciar (Esc)">
                        <i class="fa-solid fa-arrow-rotate-left"></i> ESC
                    </button>
                    <button class="hud-footer-btn" id="btn-undo" title="Remover última (R)">
                        <i class="fa-solid fa-reply"></i> R (<span id="undo-val">∞</span>)
                    </button>
                    <button class="hud-footer-btn" id="btn-auto" title="Auto-Slot (Tab)">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> TAB (<span id="auto-val">3</span>)
                    </button>
                    <button class="hud-footer-btn slot-btn" id="btn-slot" title="Encaixar (Enter)">
                        <i class="fa-solid fa-circle-check"></i> ENTER
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Principal -->
</body>
</html>
